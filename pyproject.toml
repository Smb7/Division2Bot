[project]
name = "division2bot"
version = "0.1.0"
description = "Discord slash-command bot for The Division 2 gear lookups and Escalation target loot."
requires-python = ">=3.12"
license = "MIT"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "ignore:'audioop' is deprecated:DeprecationWarning",
]
